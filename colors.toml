mode = "dark"

# Shellac - Mississippi Delta, 1936. A man, a guitar, a dirt road crossing.
# Painted after King of the Delta Blues Singers: rust dust, maroon shadow, paper-white type.
# One warm hue family from the cover and walls; slots separate by lightness.
# green = cover tan, cyan = sunlit road dust, blue = dim dust tan, yellow = window light, magenta = cover maroon.

accent               = "#d87c58"  # rust
selection            = "#52281e"  # wash
muted                = "#a5856f"  # dust
background           = "#1b0a09"  # ground
dark_background      = "#130505"  # deep
darker_background    = "#0b0202"  # deeper
lighter_background   = "#291412"  # booth
foreground           = "#ead7c2"  # paper
dark_foreground      = "#c8b7a5"  # paper_dim
light_foreground     = "#f7eddf"  # paper_hi
bright_foreground    = "#f7eddf"  # paper_hi
selection_foreground = "#f7eddf"  # paper_hi
selection_background = "#52281e"  # wash
red                  = "#c55c44"  # red
orange               = "#d77e52"  # clay
yellow               = "#f5b483"  # tan
green                = "#c3a080"  # straw
cyan                 = "#e2a078"  # bone
blue                 = "#a18671"  # slate
magenta              = "#b56b70"  # mauve
brown                = "#7b4532"  # brown
bright_red           = "#d57358"  # red_hi
bright_yellow        = "#fecca4"  # tan_hi
