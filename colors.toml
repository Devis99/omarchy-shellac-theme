mode = "dark"

# Shellac - Mississippi Delta, 1936. A man, a guitar, a dirt road crossing.
# Painted after King of the Delta Blues Singers: rust dust, maroon shadow, paper-white type.
# One warm hue family from the cover and walls; slots separate by lightness.
# green = cover tan, cyan = sunlit road dust, blue = dim dust tan, yellow = window light, magenta = cover maroon.

accent               = "#c5693d"  # rust
selection            = "#52281e"  # wash
muted                = "#a5856f"  # dust
background           = "#140605"  # ground
dark_background      = "#0d0303"  # deep
darker_background    = "#070101"  # deeper
lighter_background   = "#291412"  # booth
foreground           = "#dbc0a0"  # paper
dark_foreground      = "#c8b7a5"  # paper_dim
light_foreground     = "#dbc0a0"  # paper_hi
bright_foreground    = "#dbc0a0"  # paper_hi
selection_foreground = "#dbc0a0"  # paper_hi
selection_background = "#52281e"  # wash
red                  = "#b8352c"  # red
orange               = "#f67a3c"  # clay
yellow               = "#e89d63"  # tan
green                = "#9e7b5e"  # straw
cyan                 = "#c98053"  # bone
blue                 = "#b25530"  # slate
magenta              = "#a85e3e"  # mauve
brown                = "#7b4532"  # brown
bright_red           = "#b8352c"  # red_hi
bright_yellow        = "#e89d63"  # tan_hi
